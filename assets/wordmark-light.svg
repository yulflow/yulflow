  <title>Seoyul Son</title>
  <style>
    .bar { transform-box: fill-box; transform-origin: center; stroke: rgb(107,114,128); stroke-width: 1.3; stroke-linecap: round; }
    .playhead { opacity: 0; stroke: rgb(107,114,128); stroke-width: 1; }
    .pa { animation: pa-k 2.9s ease-in-out infinite; }
    .pb { animation: pb-k 3.3s ease-in-out infinite; }
    .pc { animation: pc-k 3.6s ease-in-out infinite; }
    .pd { animation: pd-k 3.9s ease-in-out infinite; }
    .pe { animation: pe-k 4.2s ease-in-out infinite; }
    .playhead { animation: sweep 14s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .pa, .pb, .pc, .pd, .pe, .playhead { animation: none; }
    }
    @keyframes pa-k { 0%,100% { transform: scaleY(0.85); } 45% { transform: scaleY(1.15); } }
    @keyframes pb-k { 0%,100% { transform: scaleY(0.8); } 55% { transform: scaleY(1.2); } }
    @keyframes pc-k { 0%,100% { transform: scaleY(0.88); } 50% { transform: scaleY(1.12); } }
    @keyframes pd-k { 0%,100% { transform: scaleY(0.82); } 60% { transform: scaleY(1.18); } }
    @keyframes pe-k { 0%,100% { transform: scaleY(0.86); } 40% { transform: scaleY(1.14); } }
    @keyframes sweep {
      0%   { transform: translateX(0); opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(784px); opacity: 0; }
    }
  </style>

